[build-system]
requires = ["setuptools>=64"]  # >=64 = รองรับ editable install (PEP 660)
build-backend = "setuptools.build_meta"

[project]
name = "roastml"
dynamic = ["version"]
description = "จำแนกระดับคั่วเมล็ดกาแฟจากรูป (light / medium / dark) — runtime สำหรับ Pi"
requires-python = ">=3.11"
# runtime ขั้นต่ำของ contract (api + stub) ใช้แค่ Pillow
# version ที่ pin สำหรับ Pi อยู่ใน requirements-pi.txt
dependencies = ["pillow"]

[project.optional-dependencies]
heic = ["pillow-heif"]
dev = ["pytest"]
# ใช้บน notebook เท่านั้น (เตรียมข้อมูล / baseline / กราฟ) — Pi ใช้ requirements-pi.txt
# sklearn / matplotlib ห้ามเข้า runtime บน Pi · torch ติดตั้งแยก (เลือก CUDA build เอง)
train = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "scikit-learn",
    "matplotlib",
]

[tool.setuptools.dynamic]
version = { attr = "roastml.__version__" }

[tool.setuptools.packages.find]
include = ["roastml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # ให้ test import tools.* ได้ (tools ไม่ได้อยู่ใน wheel)
